# Amplify Hosting response headers (applied by CloudFront to every path).
# This file overrides headers set in the Amplify console. Keep each value on one quoted line:
# Amplify's parser rejects YAML folded blocks.
customHeaders:
  - pattern: '**'
    headers:
      # HTTPS-only for a year, including subdomains (no preload yet: it is hard to undo)
      - key: 'Strict-Transport-Security'
        value: 'max-age=31536000; includeSubDomains'
      # Everything loads from our own origin; verified against the production build with zero violations
      - key: 'Content-Security-Policy'
        value: "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
      - key: 'X-Content-Type-Options'
        value: 'nosniff'
      - key: 'Referrer-Policy'
        value: 'strict-origin-when-cross-origin'
      # Legacy equivalent of frame-ancestors 'none' for older browsers
      - key: 'X-Frame-Options'
        value: 'DENY'
      - key: 'Permissions-Policy'
        value: 'camera=(), microphone=(), geolocation=()'
